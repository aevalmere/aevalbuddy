# The Tauri rewrite (branch rust-rewrite). Every gate runs here: no Rust
# toolchain is installed on a developer machine for this project. Results,
# pass or fail, land on the ci-logs branch under <ref>/<sha>/rust/; wait for
# them with `node tools/ci-wait.mjs <sha>` rather than the GitHub API.
name: rust

on:
  push:
    branches: [rust-rewrite, "rust/**"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # The bundler pins its NSIS toolset per CLI release; tools/seed-nsis.ps1
      # holds this release's hashes, so the two move together.
      TAURI_CLI: '2.12.4'
    defaults:
      run:
        shell: pwsh
        working-directory: src-tauri
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Rust toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # whisper.cmake reaches whisper.cpp's CMake build through an env var whose
      # value never changes, so cargo cannot see an edit to it and would keep a
      # cached whisper-rs-sys built with the old flags (D-voice-15 shipped /Od
      # that way). Its hash is part of the key and of the restore prefix, so a
      # change to it starts from a clean target once.
      - name: Cache cargo
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/src/voice/whisper.cmake') }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/src/voice/whisper.cmake') }}-

      # Each gate tees its output to $RUNNER_TEMP/ci-logs/<title>.log for the
      # ci-logs branch, and repeats the end of it as an annotation.
      - name: Gate helper
        id: helper
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'ci-logs') | Out-Null
          @'
          param([string]$Title, [string]$Command)
          $out = Join-Path $env:RUNNER_TEMP "ci-logs\$Title.log"
          cmd /c "$Command 2>&1" | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # An annotation holds 4096 characters and a step keeps 10 errors,
            # so the last ~36 KB goes out in up to nine pieces, in order.
            $tail = ((Get-Content $out -Tail 600) -join "`n").Replace("`r", '')
            $size = 4000
            $start = [Math]::Max(0, $tail.Length - 9 * $size)
            $n = [Math]::Ceiling(($tail.Length - $start) / $size)
            for ($i = 0; $i -lt $n; $i++) {
              $c = $tail.Substring($start + $i * $size, [Math]::Min($size, $tail.Length - $start - $i * $size))
              $enc = $c.Replace('%', '%25').Replace("`n", '%0A')
              Write-Output "::error title=$Title $($i + 1) of $n::$enc"
            }
            exit $code
          }
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'gate.ps1')

      # The desktop helper ships prebuilt (DESK-12): compile host.cs once,
      # bundle build/desktop-<hash>.dll, and pin its SHA-256 into the exe.
      - name: Prebuild desktop helper
        id: prebuild
        run: |
          & "$env:RUNNER_TEMP\gate.ps1" prebuild "node ../tools/build-desktop.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-Content ../lib/desktop/prebuilt.json -Raw | ConvertFrom-Json).sha256
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw "no prebuilt sha: $sha" }
          "AEVAL_DESKTOP_DLL_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Format
        id: fmt
        run: '& "$env:RUNNER_TEMP\gate.ps1" fmt "cargo fmt --all -- --check"'

      # With no local toolchain, a failed fmt gate hands back its fix: the
      # rustfmt patch, as ci-logs/<ref>/<sha>/rust/fmt.patch and gzipped and
      # base64'd across warning annotations (`fmtpatch i of n`), to be applied
      # with `git apply`.
      - name: Format patch
        id: fmtpatch
        if: failure()
        run: |
          cargo fmt --all
          git diff --output="$env:RUNNER_TEMP\ci-logs\fmt.patch"
          $bytes = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\ci-logs\fmt.patch")
          $ms = New-Object IO.MemoryStream
          $gz = New-Object IO.Compression.GZipStream($ms, [IO.Compression.CompressionMode]::Compress)
          $gz.Write($bytes, 0, $bytes.Length)
          $gz.Close()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          $size = 4000
          $n = [Math]::Ceiling($b64.Length / $size)
          for ($i = 0; $i -lt $n; $i++) {
            $c = $b64.Substring($i * $size, [Math]::Min($size, $b64.Length - $i * $size))
            Write-Output "::warning title=fmtpatch $($i + 1) of $n::$c"
          }
          git checkout -- .

      - name: Clippy
        id: clippy
        if: success() || failure()
        run: '& "$env:RUNNER_TEMP\gate.ps1" clippy "cargo clippy --all-targets --color never -- -D warnings"'

      - name: Unit tests
        id: test
        if: success() || failure()
        run: '& "$env:RUNNER_TEMP\gate.ps1" test "cargo test --color never"'

      # The bundler downloads NSIS and nsis_tauri_utils.dll from github.com
      # release assets into %LOCALAPPDATA%\tauri\NSIS when that folder is not
      # complete, and that endpoint answers 504 for days at a time. The
      # folder comes from the cache, else tools/seed-nsis.ps1 builds it
      # (NSIS from SourceForge, the vendored DLL) with the hashes the
      # bundler checks, so the build downloads nothing. Saved as soon as it
      # is seeded, whatever the later steps do.
      - name: Restore NSIS toolset
        id: nsiscache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-${{ runner.os }}-${{ env.TAURI_CLI }}-${{ hashFiles('tools/seed-nsis.ps1', 'tools/nsis/*') }}

      - name: Seed NSIS toolset
        id: nsis
        run: '& "$env:RUNNER_TEMP\gate.ps1" nsis "pwsh -NoProfile -File ../tools/seed-nsis.ps1"'

      - name: Save NSIS toolset
        id: nsissave
        if: steps.nsis.outcome == 'success' && steps.nsiscache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ steps.nsiscache.outputs.cache-primary-key }}

      # Retried only when the log ends on a bundler download failure (an
      # HTTP status, a refused or timed-out request), never on a compile
      # error; the retry reuses the compiled target, so it only bundles. With
      # the toolset seeded there should be no download at all: a bundler that
      # still verified or replaced NSIS means seed-nsis.ps1 is out of date.
      - name: Build installer
        id: build
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\build.log'
          $download = 'failed to bundle project.*(http status|error sending request|timed out|timeout|connection|dns error|download)'
          $notes = @()
          for ($try = 1; $try -le 3; $try++) {
            & "$env:RUNNER_TEMP\gate.ps1" build "npx --yes @tauri-apps/cli@$env:TAURI_CLI build --bundles nsis"
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            $hit = Select-String -Path $log -Pattern $download | Select-Object -Last 1
            if (-not $hit -or $try -eq 3) { break }
            $notes += "build try $try failed on a bundler download, retrying: $($hit.Line.Trim())"
            Write-Output "::warning title=Build installer::$($notes[-1].Replace('%', '%25'))"
            Start-Sleep -Seconds (20 * $try)
          }
          $redo = Select-String -Path $log -Pattern 'Verifying NSIS package|NSIS directory (is missing|contains mis-hashed)|NSIS\.exe is (outdated|missing)' | Select-Object -First 1
          if ($redo) {
            $notes += "the bundler did not take the seeded NSIS toolset ($($redo.Line.Trim())); tools/seed-nsis.ps1 no longer matches tauri-cli $env:TAURI_CLI"
            Write-Output "::warning title=Build installer::$($notes[-1].Replace('%', '%25'))"
          }
          if ($notes) { @($notes) + @('') + @(Get-Content $log) | Set-Content $log }
          exit $code

      # The smoke run (src-tauri/src/selftest): every lane's probe inside the
      # built exe. tools/smoke-gate.mjs fails it on any =FAIL line, on a
      # missing "[SMOKE] done", and on any label listed in
      # tools/smoke-labels/*.txt that never printed; it checks itself first.
      - name: Smoke
        id: smoke
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\smoke.log'
          $exe = 'target\release\AevalBuddy.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          node ../tools/smoke-gate.mjs --self-test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::the smoke gate failed its own self-test'; exit 1 }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-smoke'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_SMOKE = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'smoke.out'
          $err = Join-Path $env:RUNNER_TEMP 'smoke.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle # keeps ExitCode readable once the process is gone
          $timedOut = -not $p.WaitForExit(360000)
          if ($timedOut) { $p.Kill(); Write-Output '::error::smoke timed out after 360 s' }
          $code = if ($timedOut) { 'timeout' } else { $p.ExitCode }
          @(Get-Content $out -ErrorAction SilentlyContinue) + @('--- stderr ---') + @(Get-Content $err -ErrorAction SilentlyContinue) + @("--- exit code: $code") | Add-Content $log
          $gate = @(node ../tools/smoke-gate.mjs $out 2>&1)
          $gateCode = $LASTEXITCODE
          $gate | Add-Content $log
          $gate
          foreach ($b in @($gate | Where-Object { $_ -match '^\[GATE\] (fail|missing|verdict=FAIL)' } | Select-Object -First 9)) {
            Write-Output "::error title=smoke gate::$($b.Replace('%', '%25'))"
          }
          # Every [SMOKE] line as annotations, readable without a token (a
          # panic in host::setup or a hook shows in the stderr tail).
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          $ok = -not $timedOut -and $code -eq 0 -and $gateCode -eq 0
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[SMOKE\]' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + ((Get-Content $err -Tail 40 -ErrorAction SilentlyContinue) -join "`n") }
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=smoke $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          if (-not $ok) { Add-Content $log "smoke failed: exit code $code, gate exit code $gateCode"; exit 1 }

      # Split (c): capture fidelity and exclusion on the runner's real screen,
      # then the desktop selfcheck (Notepad included).
      - name: Capture check
        id: capture
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\capture.log'
          $exe = 'target\release\AevalBuddy.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          if (-not (Test-Path 'target\release\desktop')) { Write-Output '::warning::no bundled desktop/ folder beside the exe' }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-capture'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_CAPTURE_CHECK = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'capture.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'capture.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $errFile
          $timedOut = -not $p.WaitForExit(180000)
          if ($timedOut) { $p.Kill(); Write-Output '::error::capture check timed out' }
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          $errText = (Get-Content $errFile -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $text $errText
          # stdout and the whole of stderr, for the ci-logs branch.
          @($text, '--- stderr ---') + @(Get-Content $errFile -ErrorAction SilentlyContinue) | Set-Content $log
          if ($timedOut) { Add-Content $log 'capture check timed out after 180 s' }
          $ok = $text -match '\[CAPTURE\] done'
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[CAPTURE\]' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + $errText }
          # 4096 characters per annotation, 10 per level per step.
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=capture check $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          if (-not $ok) { Add-Content $log 'capture check failed: no "[CAPTURE] done" line'; exit 1 }

      - name: Desktop selfcheck
        id: desktop
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\desktop.log'
          $exe = 'target\release\AevalBuddy.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-desktop'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_DESKTOP_CHECK = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'desktop.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'desktop.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $errFile
          $timedOut = -not $p.WaitForExit(240000)
          if ($timedOut) { $p.Kill(); Write-Output '::error::desktop selfcheck timed out' }
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          $errText = (Get-Content $errFile -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $text $errText
          # stdout and the whole of stderr, for the ci-logs branch.
          @($text, '--- stderr ---') + @(Get-Content $errFile -ErrorAction SilentlyContinue) | Set-Content $log
          if ($timedOut) { Add-Content $log 'desktop selfcheck timed out after 240 s' }
          $ok = $text -match '\[DESKTOP\] done'
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[DESKTOP\]' -and $_ -notmatch 'typeReadText|editorCandidates' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + $errText }
          # 4096 characters per annotation, 10 per level per step.
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=desktop selfcheck $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          if (-not $ok) { Add-Content $log 'desktop selfcheck failed: no "[DESKTOP] done" line'; exit 1 }

      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aevalbuddy-tauri-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Last, pass, fail or cancel: summary.md, errors.txt and every gate's
      # log to ci-logs/<ref>/<sha>/rust/ (tools/ci-publish.mjs). A failure to
      # publish never turns a green run red.
      - name: Publish to ci-logs
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          CI_WORKFLOW: rust
          CI_STATUS: ${{ job.status }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_STEPS: |
            Checkout|${{ steps.checkout.outcome }}
            Node|${{ steps.node.outcome }}
            Rust toolchain|${{ steps.toolchain.outcome }}
            Cache cargo|${{ steps.cache.outcome }}
            Gate helper|${{ steps.helper.outcome }}
            Prebuild desktop helper|${{ steps.prebuild.outcome }}|prebuild.log
            Format|${{ steps.fmt.outcome }}|fmt.log
            Format patch|${{ steps.fmtpatch.outcome }}|fmt.patch
            Clippy|${{ steps.clippy.outcome }}|clippy.log
            Unit tests|${{ steps.test.outcome }}|test.log
            Restore NSIS toolset|${{ steps.nsiscache.outcome }}
            Seed NSIS toolset|${{ steps.nsis.outcome }}|nsis.log
            Save NSIS toolset|${{ steps.nsissave.outcome }}
            Build installer|${{ steps.build.outcome }}|build.log
            Smoke|${{ steps.smoke.outcome }}|smoke.log
            Capture check|${{ steps.capture.outcome }}|capture.log
            Desktop selfcheck|${{ steps.desktop.outcome }}|desktop.log
            Upload installer|${{ steps.upload.outcome }}
        run: node tools/ci-publish.mjs
