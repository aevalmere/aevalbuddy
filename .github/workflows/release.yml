# Cuts a release. Push a tag like v1.1.0 and this builds the Windows
# installer and publishes a GitHub release of the same name holding three
# files: AevalBuddy-Setup.exe, its blockmap, and latest.yml. Installed copies
# read latest.yml on their next check, and the README's download link serves
# the exe. Bump the version in package.json first; the tag has to match it.
#
# A tag with a hyphen (v2.0.0-beta.1) is published as a prerelease and never
# marked latest. electron-updater on a stable version ignores prereleases,
# and the README link follows "latest", so a beta reaches nobody who did not
# go looking for it.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # electron-builder names the release after package.json, not the tag,
      # so a mismatch would publish somewhere this run is not looking.
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match package.json ($want)"
            exit 1
          fi
      - run: npm ci
      # The first lines of the notes are what an installed copy shows under
      # "New in 1.2.0" in Settings > About, so they say what changed. How to
      # install comes after, for whoever arrives from the README.
      - name: Write the release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$TAG"
            else
              git log --no-merges --pretty='- %s' -n 20 "$TAG"
            fi
            echo
            echo "## Installing"
            echo
            echo '**Download `AevalBuddy-Setup.exe` below and run it.** It installs in a few seconds, with no admin prompt, and opens the app.'
            echo
            echo 'If Windows says "Windows protected your PC", click **More info**, then **Run anyway**. The installer is not code-signed; this is not a virus warning.'
            echo
            echo 'On first launch a pointer walks you to Settings to paste an OpenRouter key, free at https://openrouter.ai/keys. Already installed? It updates itself.'
          } > notes.md
          cat notes.md
      # electron-builder uploads with more than one publisher at once, and
      # each one that finds no release for the tag creates its own. Left to
      # itself it made two v1.1.0 releases, the exe in one and the blockmap
      # in the other, and the download link 404'd. A draft made first is
      # found by every publisher, and nobody sees it until it is complete.
      # A re-run finds the draft from the failed attempt and reuses it.
      - name: Create the release as a draft
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; bump the version instead of re-releasing"
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "AevalBuddy ${TAG#v}" --notes-file notes.md
          fi
      - run: npm run build -- --publish always
      # Every file latest.yml names must be attached, under that name, with
      # the bytes it describes. An installed copy that finds latest.yml but
      # 404s on the exe, or gets bytes whose sha512 differs, fails every
      # check until the next release.
      - name: Check the draft against latest.yml
        run: |
          export NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name')
          rm -rf check && mkdir check
          gh release download "$TAG" -p latest.yml -D check
          node - <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const yml = fs.readFileSync('check/latest.yml', 'utf8');
          const field = (k) => (yml.match(new RegExp(`^${k}: (.+)$`, 'm')) || [])[1];
          const file = field('path');
          const want = field('sha512');
          const version = field('version');
          const names = process.env.NAMES.split(/\r?\n/);
          const fail = (m) => { console.log(`::error::${m}`); process.exitCode = 1; };
          if (version !== process.env.TAG.replace(/^v/, '')) fail(`latest.yml says ${version}, tag is ${process.env.TAG}`);
          for (const n of [file, `${file}.blockmap`, 'latest.yml']) {
            if (!names.includes(n)) fail(`${n} is missing from the ${process.env.TAG} release`);
          }
          const got = crypto.createHash('sha512').update(fs.readFileSync(`dist/${file}`)).digest('base64');
          if (got !== want) fail(`dist/${file} sha512 ${got} does not match latest.yml ${want}`);
          console.log(`latest.yml ${version} -> ${file}, sha512 matches`);
          EOF
      - name: Publish once every file is attached
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      # What an installed copy and the README link actually see, from
      # outside, without a token.
      - name: Check the public feed
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          base="https://github.com/${{ github.repository }}/releases"
          for i in 1 2 3 4 5 6; do
            tag=$(curl -sfL -H 'Accept: application/json' "$base/latest" | node -p "JSON.parse(require('fs').readFileSync(0)).tag_name" || true)
            [ "$tag" = "$TAG" ] && break
            sleep 10
          done
          if [ "$tag" != "$TAG" ]; then
            echo "::error::releases/latest is $tag, not $TAG"
            exit 1
          fi
          curl -sfL "$base/latest/download/latest.yml" | grep -qx "version: ${TAG#v}" ||
            { echo "::error::releases/latest/download/latest.yml is not ${TAG#v}"; exit 1; }
          curl -sfIL "$base/latest/download/AevalBuddy-Setup.exe" >/dev/null ||
            { echo "::error::the README download link does not resolve"; exit 1; }
          echo "public feed serves $TAG"
