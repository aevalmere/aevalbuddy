# Cuts a release. Push a tag like v1.1.0 and this builds the Tauri app's
# Windows installer and publishes a GitHub release of the same name holding
# two files: Aevaleron-Setup.exe and latest.yml (electron-builder's feed
# format, which both the Rust updater and installed Electron copies read).
# The README's download link serves the exe, so its name never carries a
# version. Bump the version in package.json first; the tag has to match it
# (tauri.conf.json reads its version from package.json).
#
# A tag with a hyphen (v2.0.0-beta.1) is published as a prerelease and never
# marked latest. electron-updater on a stable version ignores prereleases,
# and the README link follows "latest", so a beta reaches nobody who did not
# go looking for it.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      # The same CLI as rust.yml; tools/seed-nsis.ps1 holds its NSIS hashes.
      TAURI_CLI: '2.12.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The notes list the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # The app reports package.json's version, so a mismatch would publish a
      # build that offers itself as an update forever.
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match package.json ($want)"
            exit 1
          fi
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The first lines of the notes are what an installed copy shows under
      # "New in 1.2.0" in Settings > About, so they say what changed. How to
      # install comes after, for whoever arrives from the README.
      - name: Write the release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$TAG"
            else
              git log --no-merges --pretty='- %s' -n 20 "$TAG"
            fi
            echo
            echo "## Installing"
            echo
            echo '**Download `Aevaleron-Setup.exe` below and run it.** It installs in a few seconds, with no admin prompt, and opens the app.'
            echo
            echo 'If Windows says "Windows protected your PC", click **More info**, then **Run anyway**. The installer is not code-signed; this is not a virus warning.'
            echo
            echo 'On first launch a pointer walks you to Settings to paste an OpenRouter key, free at https://openrouter.ai/keys. Already installed? It updates itself.'
          } > notes.md
          cat notes.md
      # A draft made first, and published only once every file is attached:
      # nobody sees a release with a missing file (v1.1.0's split release
      # 404'd the download link). A re-run reuses the draft.
      - name: Create the release as a draft
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; bump the version instead of re-releasing"
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Aevaleron ${TAG#v}" --notes-file notes.md
          fi
      # The desktop helper ships prebuilt (DESK-12): compile host.cs once,
      # bundle build/desktop-<hash>.dll, and pin its SHA-256 into the exe so
      # a swapped file beside it is never loaded.
      - name: Prebuild the desktop helper
        run: |
          node tools/build-desktop.js
          sha=$(node -p "require('./lib/desktop/prebuilt.json').sha256")
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::no prebuilt sha: $sha"; exit 1; fi
          echo "AEVAL_DESKTOP_DLL_SHA=$sha" >> "$GITHUB_ENV"
      # The bundler's own NSIS download (github.com release assets) answers
      # 504 for days at a time; the toolset is seeded from SourceForge and
      # the vendored DLL instead, with the hashes the bundler checks, so the
      # build downloads nothing.
      - name: Seed the NSIS toolset
        run: pwsh -NoProfile -File tools/seed-nsis.ps1
      - name: Build the installer
        working-directory: src-tauri
        run: npx --yes "@tauri-apps/cli@$TAURI_CLI" build --bundles nsis
      # Tauri names the installer Aevaleron_<version>_x64-setup.exe; the
      # README link and every installed copy want Aevaleron-Setup.exe.
      - name: Name the installer and write latest.yml
        run: |
          mkdir -p dist
          src=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          [ -n "$src" ] || { echo "::error::no NSIS installer was built"; exit 1; }
          cp "$src" dist/Aevaleron-Setup.exe
          node - <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const file = 'Aevaleron-Setup.exe';
          const buf = fs.readFileSync(`dist/${file}`);
          const sha512 = crypto.createHash('sha512').update(buf).digest('base64');
          const version = process.env.TAG.replace(/^v/, '');
          const yml = [
            `version: ${version}`,
            'files:',
            `  - url: ${file}`,
            `    sha512: ${sha512}`,
            `    size: ${buf.length}`,
            `path: ${file}`,
            `sha512: ${sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            '',
          ].join('\n');
          fs.writeFileSync('dist/latest.yml', yml);
          console.log(yml);
          EOF
      - name: Attach the files
        run: gh release upload "$TAG" dist/Aevaleron-Setup.exe dist/latest.yml --clobber
      # Every file latest.yml names must be attached, under that name, with
      # the bytes it describes. An installed copy that finds latest.yml but
      # 404s on the exe, or gets bytes whose sha512 differs, fails every
      # check until the next release.
      - name: Check the draft against latest.yml
        run: |
          export NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name')
          rm -rf check && mkdir check
          gh release download "$TAG" -p latest.yml -D check
          node - <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const yml = fs.readFileSync('check/latest.yml', 'utf8');
          const field = (k) => (yml.match(new RegExp(`^${k}: (.+)$`, 'm')) || [])[1];
          const file = field('path');
          const want = field('sha512');
          const version = field('version');
          const names = process.env.NAMES.split(/\r?\n/);
          const fail = (m) => { console.log(`::error::${m}`); process.exitCode = 1; };
          if (version !== process.env.TAG.replace(/^v/, '')) fail(`latest.yml says ${version}, tag is ${process.env.TAG}`);
          if (file !== 'Aevaleron-Setup.exe') fail(`latest.yml points at ${file}, not Aevaleron-Setup.exe`);
          for (const n of [file, 'latest.yml']) {
            if (!names.includes(n)) fail(`${n} is missing from the ${process.env.TAG} release`);
          }
          const got = crypto.createHash('sha512').update(fs.readFileSync(`dist/${file}`)).digest('base64');
          if (got !== want) fail(`dist/${file} sha512 ${got} does not match latest.yml ${want}`);
          console.log(`latest.yml ${version} -> ${file}, sha512 matches`);
          EOF
      - name: Publish once every file is attached
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      # What an installed copy and the README link actually see, from
      # outside, without a token.
      - name: Check the public feed
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          base="https://github.com/${{ github.repository }}/releases"
          for i in 1 2 3 4 5 6; do
            tag=$(curl -sfL -H 'Accept: application/json' "$base/latest" | node -p "JSON.parse(require('fs').readFileSync(0)).tag_name" || true)
            [ "$tag" = "$TAG" ] && break
            sleep 10
          done
          if [ "$tag" != "$TAG" ]; then
            echo "::error::releases/latest is $tag, not $TAG"
            exit 1
          fi
          curl -sfL "$base/latest/download/latest.yml" | grep -qx "version: ${TAG#v}" ||
            { echo "::error::releases/latest/download/latest.yml is not ${TAG#v}"; exit 1; }
          curl -sfIL "$base/latest/download/Aevaleron-Setup.exe" >/dev/null ||
            { echo "::error::the README download link does not resolve"; exit 1; }
          echo "public feed serves $TAG"
