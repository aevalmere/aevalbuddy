# Installs the real installer on a clean Windows machine in GitHub's cloud and
# runs the app from where it landed: the smoke test, the visual self-check,
# then an uninstall. Nothing runs on anyone's desktop. A push to main tests a
# fresh build of that commit; a finished release tests the file the README's
# download link serves, so a broken deliverable shows up here first. See
# tools/installer-check.ps1 for what is checked, and tools/desktop-check.js
# for the desktop engine, which drives a Notepad of its own on this machine.
name: installer

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: write
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name != 'workflow_run'
        with:
          node-version: 20
          cache: npm
      - name: Build the installer from this commit
        if: github.event_name != 'workflow_run'
        run: |
          npm ci
          npm run build -- --publish never
          "INSTALLER=$PWD\dist\AevalBuddy-Setup.exe" >> $env:GITHUB_ENV
          "VERSION=$(node -p "require('./package.json').version")" >> $env:GITHUB_ENV
      - name: Download the installer the README links to
        if: github.event_name == 'workflow_run'
        run: |
          $base = 'https://github.com/${{ github.repository }}/releases/latest/download'
          New-Item -ItemType Directory -Force dl | Out-Null
          Invoke-WebRequest "$base/AevalBuddy-Setup.exe" -OutFile dl\AevalBuddy-Setup.exe
          Invoke-WebRequest "$base/latest.yml" -OutFile dl\latest.yml
          $yml = Get-Content dl\latest.yml -Raw
          $want = [regex]::Match($yml, '(?m)^sha512: (\S+)').Groups[1].Value
          $bytes = [IO.File]::ReadAllBytes("$PWD\dl\AevalBuddy-Setup.exe")
          $got = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          if ($got -ne $want) {
            "::error title=download::the file behind the README link does not match latest.yml"
            exit 1
          }
          "INSTALLER=$PWD\dl\AevalBuddy-Setup.exe" >> $env:GITHUB_ENV
          "VERSION=$([regex]::Match($yml, '(?m)^version: (\S+)').Groups[1].Value)" >> $env:GITHUB_ENV
      # Windows.Media.Ocr needs a recogniser language; runner images do not
      # always ship one. Best effort: ocrWords says so if this did not take.
      - name: Make sure Windows OCR has a language
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $cap = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US*'
          $cap | Format-Table Name, State
          if ($cap -and $cap.State -ne 'Installed') { $cap | Add-WindowsCapability -Online | Format-Table }
      # The desktop engine from source, outside Electron: opens a Notepad of
      # its own, reads, OCRs, types, sets and reads back, closes it unsaved.
      # The installed exe runs the same checks again in its smoke test, with
      # the helper loaded out of app.asar.
      - name: Desktop engine check
        run: |
          node tools/desktop-check.js 2>&1 | Tee-Object -FilePath desktop-check.log
          $code = $LASTEXITCODE
          Get-Content desktop-check.log | Where-Object { $_ -match '=FAIL' } | ForEach-Object { "::error title=desktop-check::$_" }
          "::notice title=desktop-check::$((Get-Content desktop-check.log | Where-Object { $_ -match '^\[DESKTOP\]' }) -join '%0A')"
          exit $code
      # Runs even when the desktop check failed, so one bad engine run does
      # not hide the installer results.
      - name: Install, run, uninstall
        if: ${{ !cancelled() && env.INSTALLER != '' }}
        run: ./tools/installer-check.ps1 -Installer $env:INSTALLER -Version $env:VERSION -Out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-check
          path: out/
      # Artifacts need gh auth to download; a branch does not. Each push to
      # main publishes its screenshots to the orphan branch `shots`, one folder
      # per commit plus latest/, readable at
      # raw.githubusercontent.com/<repo>/shots/latest/<name>.png. The branch is
      # rewritten as one commit each time and keeps the 15 newest folders.
      - name: Publish the screenshots to the shots branch
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $src = Join-Path $PWD 'out\shots'
          if (-not (Test-Path $src) -or -not (Get-ChildItem $src -Filter *.png)) { "no screenshots to publish"; exit 0 }
          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          $dir = Join-Path $env:RUNNER_TEMP 'shots-branch'
          git clone --quiet --depth 1 --branch shots $remote $dir 2>$null
          if ($LASTEXITCODE -ne 0) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            git -C $dir init --quiet
            git -C $dir remote add origin $remote
          }
          Remove-Item -Recurse -Force (Join-Path $dir '.git')
          git -C $dir init --quiet
          git -C $dir checkout --quiet --orphan shots
          $sha = '${{ github.sha }}'
          foreach ($d in @($sha, 'latest')) {
            $t = Join-Path $dir $d
            if (Test-Path $t) { Remove-Item -Recurse -Force $t }
            New-Item -ItemType Directory -Force $t | Out-Null
            Copy-Item (Join-Path $src '*.png') $t
          }
          # order.txt lists the commit folders newest first; a clone's mtimes cannot.
          $orderFile = Join-Path $dir 'order.txt'
          $order = @($sha) + @(if (Test-Path $orderFile) { Get-Content $orderFile | Where-Object { $_ -and $_ -ne $sha } })
          $order | Select-Object -Skip 15 | ForEach-Object { $o = Join-Path $dir $_; if (Test-Path $o) { Remove-Item -Recurse -Force $o } }
          $order | Select-Object -First 15 | Set-Content $orderFile
          git -C $dir add -A
          git -C $dir -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit --quiet -m "Screenshots for $sha"
          git -C $dir push --quiet --force $remote shots
