<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>AevalBuddy guide</title>
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="cursor-buddy.css" />
</head>
<body>
  <!-- A soft, rounded pointer rather than a copy of the Windows arrow: same
       job, but plumper, with rounded joins and the app's own accent, so it
       reads as the buddy's hand and not as a stray system cursor. The apex of
       the path is at (3.38, 0.29) in this viewBox; the stylesheet pulls the
       svg back by that much, so translating the element to a coordinate lands
       the tip on that exact pixel. Move the path and the offset moves with
       it. -->
  <div id="buddy" aria-hidden="true">
    <svg class="arrow" viewBox="0 0 26 30" width="26" height="30">
      <path class="arrow-body"
            d="M2.6 1.6 L2.6 20.4 Q2.6 22.6 4.3 21.2 L8.6 17.5 L11.5 24.6
               Q12.2 26.3 13.9 25.6 L15.6 24.9 Q17.3 24.2 16.6 22.5
               L13.9 15.9 L19.4 15.6 Q21.6 15.5 20.1 13.9 L4.8 0.9
               Q2.6 -0.6 2.6 1.6 Z" />
    </svg>
  </div>

  <div id="callout" role="status">
    <!-- A glass card beside the pointer. No mascot, no name and no tail:
         the arrow itself is the connector. Progress is a row of pips, in a
         row of its own only when there are any; the close button sits in the
         text row. -->
    <div class="bubble-body glass thin">
      <div id="callout-head" class="bubble-head" hidden>
        <span id="callout-count" class="pips"></span>
      </div>
      <button id="callout-close" type="button" aria-label="Dismiss the pointer">
        <span class="ico i-x" aria-hidden="true"></span>
      </button>
      <p id="callout-message"></p>
      <p id="callout-hint" hidden></p>
      <div id="callout-actions" hidden></div>
    </div>
  </div>
  <script src="glass.js"></script>
  <script src="buddy.js"></script>
</body>
</html>
