<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <title>AevalBuddy guide</title>
  <link rel="stylesheet" href="cursor-buddy.css" />
</head>
<body>
  <!-- A soft, rounded pointer rather than a copy of the Windows arrow: same
       job, but plumper, with rounded joins and the app's own accent, so it
       reads as the buddy's hand and not as a stray system cursor. The tip
       still sits at the element's own origin, so translating the element to
       a coordinate lands the tip on that exact pixel. -->
  <div id="buddy" aria-hidden="true">
    <svg class="arrow" viewBox="0 0 26 30" width="26" height="30">
      <path class="arrow-body"
            d="M2.6 1.6 L2.6 20.4 Q2.6 22.6 4.3 21.2 L8.6 17.5 L11.5 24.6
               Q12.2 26.3 13.9 25.6 L15.6 24.9 Q17.3 24.2 16.6 22.5
               L13.9 15.9 L19.4 15.6 Q21.6 15.5 20.1 13.9 L4.8 0.9
               Q2.6 -0.6 2.6 1.6 Z" />
    </svg>
  </div>

  <div id="callout" role="status">
    <div class="bubble-tail" aria-hidden="true"></div>
    <div class="bubble-body">
      <div class="bubble-head">
        <span class="face" aria-hidden="true">
          <span class="eye"></span>
          <span class="eye"></span>
        </span>
        <span class="who">Buddy</span>
        <span id="callout-count"></span>
        <button id="callout-close" type="button" aria-label="Dismiss the pointer">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <p id="callout-message"></p>
      <p id="callout-hint" hidden></p>
    </div>
  </div>
  <script src="buddy.js"></script>
</body>
</html>
