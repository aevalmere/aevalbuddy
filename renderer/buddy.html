<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <title>AevalBuddy guide</title>
  <link rel="stylesheet" href="cursor-buddy.css" />
</head>
<body>
  <div id="buddy" aria-hidden="true">
    <span class="ring"></span>
    <span class="dot"></span>
  </div>
  <div id="callout" role="status">
    <button id="callout-close" type="button" aria-label="Dismiss pointer">
      <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <p id="callout-message"></p>
    <div id="callout-actions" hidden>
      <span id="callout-count"></span>
      <button id="callout-next" type="button" class="callout-btn">Next</button>
    </div>
    <p class="callout-hint">Esc also dismisses this</p>
  </div>
  <script src="buddy.js"></script>
</body>
</html>
