<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>AevalBuddy</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body data-mode="pill">
  <!-- The collapsed state says what it is and what it is doing. A bare dot
       told you neither, so there was nothing to learn from looking at it. -->
  <div id="pill" role="button" tabindex="0" aria-label="Ask AevalBuddy about your screen">
    <svg class="pill-mark" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.4 8.4 0 0 1 3.6 11 8.4 8.4 0 0 1 12 2.6a8.4 8.4 0 0 1 9 8.9z"></path>
    </svg>
    <span class="pill-label">Ask</span>
    <span class="pill-dot" aria-hidden="true"></span>
  </div>

  <section id="panel" hidden aria-label="AevalBuddy query panel">
    <div class="panel-top">
      <input
        id="query-input"
        type="text"
        placeholder="Ask about your screen..."
        aria-label="Ask about your screen. Press Enter to send."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="region-btn" type="button" aria-label="Ask about an area of the screen"
              title="Ask about an area">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
          <path d="M2 6h14a2 2 0 0 1 2 2v14"></path>
        </svg>
      </button>
      <button id="settings-btn" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="close-btn" type="button" aria-label="Collapse overlay">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- An area constrains every message in the conversation, not just the
         one that chose it, so it stays on screen for as long as it is in
         force. A follow-up answered from a corner of the screen with nothing
         saying so is indistinguishable from a bad answer. -->
    <div id="region-chip" hidden>
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
        <path d="M2 6h14a2 2 0 0 1 2 2v14"></path>
      </svg>
      <span id="region-size"></span>
      <button id="region-clear" type="button">Whole screen</button>
    </div>

    <div id="notice" role="status" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="notice-text"></span>
      <button id="notice-settings" type="button" class="accent-btn" hidden>Open settings</button>
    </div>

  </section>

  <section id="hud" hidden aria-label="Input position editor">
    <div class="hud-inner">
      <p class="hud-title">Input bar</p>
      <p class="hud-sub">Drag anywhere. It snaps to screen edges and corners.</p>
      <button id="hud-done" type="button" class="accent-btn">Done</button>
    </div>
  </section>

  <script src="overlay.js"></script>
</body>
</html>
