<!DOCTYPE html>
<html lang="en" data-resize="x" data-resize-target="#bar">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>AevalBuddy</title>
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="overlay.css" />
  <link rel="stylesheet" href="voice.css" />
</head>
<body data-mode="pill" data-surface="bar">
  <!-- The orb. One glass circle with the product's pointer in it; what it
       is doing is its rim (working), a badge (a conversation waiting, or a
       failure) or a step number (a task running). Its name says the same
       for a screen reader. -->
  <div id="pill" class="glass thin interactive" role="button" tabindex="0" aria-label="Open AevalBuddy">
    <svg class="orb-mark" viewBox="0 0 26 30" width="17" height="20" aria-hidden="true">
      <path d="M2.6 1.6 L2.6 20.4 Q2.6 22.6 4.3 21.2 L8.6 17.5 L11.5 24.6
               Q12.2 26.3 13.9 25.6 L15.6 24.9 Q17.3 24.2 16.6 22.5
               L13.9 15.9 L19.4 15.6 Q21.6 15.5 20.1 13.9 L4.8 0.9
               Q2.6 -0.6 2.6 1.6 Z" />
    </svg>
    <span class="pill-label" aria-hidden="true"></span>
    <span class="pill-dot" aria-hidden="true"></span>
  </div>

  <section id="panel" hidden aria-label="AevalBuddy">
    <div id="bar" class="panel-top glass thin refract interactive">
      <!-- The token says what Enter will do with the text: guessed while
           typing, chosen with / ? > //, Ctrl+1/2/3, or this menu (Alt+Down).
           It is the one place the Ask / Find / Do keys are taught
           (REQUESTS.md 6): its tooltip, and the menu it opens. -->
      <button id="intent" class="intent-token" type="button" data-intent="ask" data-locked="false"
              data-rest="true" data-confidence="low" aria-haspopup="listbox" aria-expanded="false"
              aria-controls="intent-menu" aria-describedby="token-tip" aria-keyshortcuts="Alt+ArrowDown"
              title="Ask ? or Ctrl+1 · Find / or Ctrl+2 · Do &gt; or Ctrl+3 · Alt+Down for this menu">
        <span class="ico tok-glyph g-ask i-bubble" aria-hidden="true"></span>
        <span class="ico tok-glyph g-find i-viewfinder" aria-hidden="true"></span>
        <span class="ico tok-glyph g-do i-pointer" aria-hidden="true"></span>
        <span class="intent-name">Ask</span>
      </button>
      <!-- The model for this one question, chosen with @ as the first
           character (bar.js). Pressing it, or Backspace at the start of the
           field, gives the choice back. -->
      <button id="model-chip" class="g-chip" type="button" hidden>
        <span id="model-chip-name"></span>
        <span class="ico i-x" aria-hidden="true"></span>
      </button>
      <!-- One field, several lines: Enter sends, Shift+Enter starts a new
           line, and it grows to seven rows before it scrolls. -->
      <textarea
        id="query-input"
        rows="1"
        placeholder="Ask, find, or tell me what to do"
        aria-label="Ask, find, or tell me what to do"
        aria-describedby="intent-desc target-desc"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="send"
      ></textarea>
      <span id="intent-desc" class="sr-only"></span>
      <span id="target-desc" class="sr-only"></span>
      <!-- With two or more answer windows open, where the next question
           goes, and a way to start a new conversation instead. -->
      <div id="target-chip" hidden>
        <span id="target-text"></span>
        <button id="target-new" class="g-icon" type="button" aria-label="Start a new conversation instead"
                aria-keyshortcuts="Control+N" title="Start a new conversation instead (Ctrl+N)">
          <span class="ico i-x" aria-hidden="true"></span>
        </button>
      </div>
      <!-- voice lane: speak instead of typing (renderer/voice.js). Click, or
           hold and let go; listening, the icon becomes a level meter. -->
      <button id="mic-btn" class="g-icon" type="button" aria-pressed="false"
              aria-label="Speak instead of typing" title="Speak instead of typing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
        </svg>
        <span class="mic-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <button id="region-btn" class="g-icon" type="button" aria-label="Ask about an area of the screen"
              aria-keyshortcuts="Control+R" title="Ask about an area (Ctrl+R)">
        <span class="ico i-area" aria-hidden="true"></span>
      </button>
      <button id="settings-btn" class="g-icon" type="button" aria-label="Open settings"
              aria-keyshortcuts="Control+Comma" title="Settings (Ctrl+,)">
        <span class="ico i-gear" aria-hidden="true"></span>
      </button>
      <!-- The way back to the pill: the bar folds and its answer windows go
           with it, conversations kept; the pill or the shortcut brings them
           back. Esc on an empty field folds only the bar (D-01). -->
      <button id="close-btn" class="g-icon" type="button" aria-label="Minimize to the pill"
              aria-keyshortcuts="Control+M" title="Minimize (Ctrl+M)">
        <span class="ico i-minimize" aria-hidden="true"></span>
      </button>
    </div>

    <!-- The token's tooltip as a row anyone can see: on keyboard focus after
         600 ms and on hover after 400 ms (bar.js). Only the token teaches the
         keys (REQUESTS.md 6). -->
    <div id="token-tip" class="glass thin" role="tooltip" hidden>Ask ? or Ctrl+1 · Find / or Ctrl+2 · Do &gt; or Ctrl+3 · Alt+Down for this menu</div>

    <ul id="intent-menu" class="glass thin g-menu" role="listbox" aria-label="What Enter does" hidden>
      <li role="option" tabindex="-1" data-intent="ask"><span class="g-menu-label">Ask about the screen</span><span class="g-menu-keys"><kbd>?</kbd><kbd>Ctrl+1</kbd></span><span class="ico g-check i-check" aria-hidden="true"></span></li>
      <li role="option" tabindex="-1" data-intent="find"><span class="g-menu-label">Find words on screen</span><span class="g-menu-keys"><kbd>/</kbd><kbd>Ctrl+2</kbd></span><span class="ico g-check i-check" aria-hidden="true"></span></li>
      <li role="option" tabindex="-1" data-intent="do"><span class="g-menu-label">Do it as a task</span><span class="g-menu-keys"><kbd>&gt;</kbd><kbd>Ctrl+3</kbd></span><span class="ico g-check i-check" aria-hidden="true"></span></li>
    </ul>

    <!-- Every ready provider's models, narrowed by what follows the @. Focus
         stays in the field; the list scrolls inside the glass. -->
    <div id="model-menu" class="glass thin g-menu" role="listbox" aria-label="Model for this question" hidden>
      <div id="model-list" role="presentation"></div>
    </div>

    <!-- A task that was only guessed never starts on Enter. -->
    <div id="guess" class="guess-card glass thick" role="group" aria-labelledby="guess-text" hidden>
      <span id="guess-text"></span>
      <div class="guess-actions">
        <button id="guess-answer" type="button" class="g-btn prominent" aria-keyshortcuts="Enter">Answer <kbd aria-hidden="true">Enter</kbd></button>
        <button id="guess-run" type="button" class="g-btn" aria-keyshortcuts="Alt+Enter">Do it for me <kbd aria-hidden="true">Alt+Enter</kbd></button>
        <button id="guess-find" type="button" class="g-btn quiet">Find on screen</button>
      </div>
    </div>

    <div id="examples" role="group" aria-label="Suggestions" hidden></div>

    <!-- An area constrains every message in the conversation, not just the
         one that chose it, so it stays on screen for as long as it is in
         force. -->
    <div id="region-chip" class="glass thin" hidden>
      <span class="ico i-area" aria-hidden="true"></span>
      <span id="region-size"></span>
      <button id="region-clear" type="button" class="g-chip" aria-label="Stop using the area and ask about the whole screen">Whole screen</button>
    </div>

    <!-- Find's count and the hints live under the bar, as one row. -->
    <div id="bar-status" class="glass thin" hidden>
      <span id="bar-status-text"></span>
      <button id="bar-status-action" type="button" class="g-chip" hidden></button>
      <button id="find-scope" type="button" class="g-chip scope" hidden>This window</button>
    </div>

    <div id="notice" class="glass thin" hidden>
      <span class="ico i-info" aria-hidden="true"></span>
      <span id="notice-text"></span>
      <button id="notice-settings" type="button" class="g-btn prominent" hidden>Open settings</button>
    </div>

  </section>

  <section id="hud" class="glass thick" hidden aria-label="Input position editor" data-drag>
    <div class="hud-inner">
      <p class="hud-title">Input bar</p>
      <p class="hud-sub">Drag anywhere, or use the arrow keys. It snaps to screen edges and corners. Enter saves.</p>
      <button id="hud-done" type="button" class="g-btn prominent">Done</button>
    </div>
  </section>

  <!-- The window's live regions (AevalA11y in glass.js speaks into them):
       polite for news, assertive for errors and a task's question. -->
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <div id="announce-alert" class="sr-only" role="alert" aria-live="assertive"></div>

  <script src="glass.js"></script>
  <script src="frame.js"></script>
  <script src="intent.js"></script>
  <script src="overlay.js"></script>
  <script src="bar.js"></script>
  <script src="voice.js"></script>
</body>
</html>
