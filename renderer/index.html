<!DOCTYPE html>
<html lang="en" data-resize="x" data-resize-target="#bar">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>AevalBuddy</title>
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body data-mode="pill" data-surface="bar">
  <!-- The orb. One glass circle with the product's pointer in it; what it
       is doing is its rim (working), a badge (a conversation waiting, or a
       failure) or a step number (a task running). Its name says the same
       for a screen reader. -->
  <div id="pill" class="glass thin interactive" role="button" tabindex="0" aria-label="Open AevalBuddy">
    <svg class="orb-mark" viewBox="0 0 26 30" width="17" height="20" aria-hidden="true">
      <path d="M2.6 1.6 L2.6 20.4 Q2.6 22.6 4.3 21.2 L8.6 17.5 L11.5 24.6
               Q12.2 26.3 13.9 25.6 L15.6 24.9 Q17.3 24.2 16.6 22.5
               L13.9 15.9 L19.4 15.6 Q21.6 15.5 20.1 13.9 L4.8 0.9
               Q2.6 -0.6 2.6 1.6 Z" />
    </svg>
    <span class="pill-label" aria-hidden="true"></span>
    <span class="pill-dot" aria-hidden="true"></span>
  </div>

  <section id="panel" hidden aria-label="AevalBuddy">
    <div id="bar" class="panel-top glass thin refract">
      <!-- The token says what Enter will do with the text: guessed while
           typing, chosen with / ? > //, Ctrl+1/2/3, or this menu (Alt+Down).
           It is the one place the Ask / Find / Do keys are taught
           (REQUESTS.md 6): its tooltip, and the menu it opens. -->
      <button id="intent" class="intent-token" type="button" data-intent="ask" data-locked="false"
              data-confidence="low" aria-haspopup="listbox" aria-expanded="false"
              aria-controls="intent-menu" title="Ask ? or Ctrl+1 · Find / or Ctrl+2 · Do &gt; or Ctrl+3 · Alt+Down for this menu">
        <svg class="tok-glyph g-ask" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.6a8.1 8.1 0 0 1-8.6 8.1 8.6 8.6 0 0 1-3.7-.8L3.5 20.3l1.5-4.3a8 8 0 0 1-1-3.9 8.1 8.1 0 0 1 8-8.3 8.1 8.1 0 0 1 8.5 7.8z"></path>
        </svg>
        <svg class="tok-glyph g-find" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5"></path>
          <circle cx="12" cy="12" r="2.4"></circle>
        </svg>
        <svg class="tok-glyph g-do" viewBox="0 0 26 30" width="14" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M2.6 1.6 L2.6 20.4 Q2.6 22.6 4.3 21.2 L8.6 17.5 L11.5 24.6 Q12.2 26.3 13.9 25.6 L15.6 24.9 Q17.3 24.2 16.6 22.5 L13.9 15.9 L19.4 15.6 Q21.6 15.5 20.1 13.9 L4.8 0.9 Q2.6 -0.6 2.6 1.6 Z"></path>
        </svg>
        <span class="intent-name">Ask</span>
      </button>
      <input
        id="query-input"
        type="text"
        placeholder="Ask, find, or tell me what to do"
        aria-label="Ask, find, or tell me what to do"
        aria-describedby="intent-desc"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="intent-desc" class="sr-only"></span>
      <button id="region-btn" class="g-icon" type="button" aria-label="Ask about an area of the screen"
              title="Ask about an area">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2.5v13.5a2 2 0 0 0 2 2h13.5"></path>
          <path d="M2.5 6h13.5a2 2 0 0 1 2 2v13.5"></path>
        </svg>
      </button>
      <button id="settings-btn" class="g-icon" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <!-- Esc and a click outside collapse the bar; this stays for anyone
           who looks for a button, and for switch access. -->
      <button id="close-btn" class="g-icon" type="button" aria-label="Collapse" title="Collapse (Esc)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <line x1="17" y1="7" x2="7" y2="17"></line>
          <line x1="7" y1="7" x2="17" y2="17"></line>
        </svg>
      </button>
    </div>

    <ul id="intent-menu" class="glass thin" role="listbox" aria-label="What Enter does" hidden>
      <li role="option" tabindex="-1" data-intent="ask"><span>Ask about the screen</span><span class="keys"><kbd>?</kbd><kbd>Ctrl+1</kbd></span></li>
      <li role="option" tabindex="-1" data-intent="find"><span>Find words on screen</span><span class="keys"><kbd>/</kbd><kbd>Ctrl+2</kbd></span></li>
      <li role="option" tabindex="-1" data-intent="do"><span>Do it as a task</span><span class="keys"><kbd>&gt;</kbd><kbd>Ctrl+3</kbd></span></li>
    </ul>

    <!-- A task that was only guessed never starts on Enter. -->
    <div id="guess" class="guess-card glass thick" hidden>
      <span id="guess-text"></span>
      <div class="guess-actions">
        <button id="guess-answer" type="button" class="g-btn prominent">Just answer <kbd>Enter</kbd></button>
        <button id="guess-run" type="button" class="g-btn">Run as a task <kbd>Alt+Enter</kbd></button>
        <button id="guess-find" type="button" class="g-btn quiet">Find it</button>
      </div>
    </div>

    <div id="examples" hidden aria-label="Examples"></div>

    <!-- An area constrains every message in the conversation, not just the
         one that chose it, so it stays on screen for as long as it is in
         force. -->
    <div id="region-chip" class="glass thin" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2.5v13.5a2 2 0 0 0 2 2h13.5"></path>
        <path d="M2.5 6h13.5a2 2 0 0 1 2 2v13.5"></path>
      </svg>
      <span id="region-size"></span>
      <button id="region-clear" type="button" class="g-chip">Whole screen</button>
    </div>

    <!-- Find's count and the hints live under the bar, as one row. -->
    <div id="bar-status" class="glass thin" hidden>
      <span id="bar-status-text"></span>
      <button id="bar-status-action" type="button" class="g-chip" hidden></button>
      <button id="find-scope" type="button" class="g-chip scope" hidden>This window</button>
    </div>

    <div id="notice" class="glass thin" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="9.5"></circle>
        <line x1="12" y1="7.5" x2="12" y2="12.5"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="notice-text"></span>
      <button id="notice-settings" type="button" class="g-btn prominent" hidden>Open settings</button>
    </div>

  </section>

  <section id="hud" class="glass thick" hidden aria-label="Input position editor" data-drag>
    <div class="hud-inner">
      <p class="hud-title">Input bar</p>
      <p class="hud-sub">Drag anywhere, or use the arrow keys. It snaps to screen edges and corners. Enter saves.</p>
      <button id="hud-done" type="button" class="g-btn prominent">Done</button>
    </div>
  </section>

  <!-- The window's one live region; everything that speaks goes here. -->
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>

  <script src="glass.js"></script>
  <script src="frame.js"></script>
  <script src="intent.js"></script>
  <script src="overlay.js"></script>
  <script src="bar.js"></script>
</body>
</html>
