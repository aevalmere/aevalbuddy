<!DOCTYPE html>
<html lang="en" data-passthrough="on" data-resize="all" data-resize-target="#opanel">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>AevalBuddy answer</title>
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body data-mode="idle" data-surface="answer">
  <!-- The glob: while the window opens or closes, one piece of glass that
       stretches out of the bar and becomes the sheet (glob.js). It sits
       under the sheet, so the words arrive inside it. Its inner thin layer
       is the bar's own material at the join, fading as the body leaves.
       Hidden the rest of the time. -->
  <div id="glob" class="glass thick" aria-hidden="true" hidden>
    <div id="glob-thin" class="glass thin"></div>
    <svg id="glob-rim" width="100%" height="100%" aria-hidden="true">
      <defs>
        <linearGradient id="glob-light" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.62"></stop>
          <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"></stop>
          <stop offset="1" stop-color="#fff" stop-opacity="0.3"></stop>
        </linearGradient>
        <!-- The rim is the shape's outline, never drawn inside the bar. -->
        <mask id="glob-mask" maskUnits="userSpaceOnUse">
          <path id="glob-stroke" fill="none" stroke="#fff" stroke-width="2"></path>
          <path id="glob-fill" fill="#000"></path>
          <rect id="glob-bar" fill="#000" x="0" y="0" width="0" height="0"></rect>
        </mask>
      </defs>
      <rect width="100%" height="100%" fill="url(#glob-light)" mask="url(#glob-mask)"></rect>
    </svg>
  </div>

  <!-- The answer sheet: thick glass, because this is where you read. It is a
       window of its own; several can be open, each with its conversation. -->
  <section id="opanel" class="glass thick refract" hidden aria-labelledby="sheet-title">
    <!-- The title bar is what you hold the window by: the kind as a glyph,
         the title, and its tools. At rest only Close shows. -->
    <header id="sheet-bar" class="sheet-bar interactive" data-drag>
      <span id="sheet-kind" class="sheet-kind" role="img" aria-label="Answer">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path vector-effect="non-scaling-stroke" d="M10 3.75c3.73 0 6.5 2.55 6.5 5.75s-2.77 5.75-6.5 5.75c-.8 0-1.55-.11-2.25-.33L4.25 16.25l.95-2.85C4.27 12.36 3.5 11 3.5 9.5c0-3.2 2.77-5.75 6.5-5.75z"></path>
        </svg>
      </span>
      <h1 id="sheet-title" class="sheet-title sheet-bar-title">Answer</h1>
      <div class="sheet-tools sheet-bar-tools">
        <button id="copy-all" class="g-icon small tool-quiet" type="button" aria-label="Copy this conversation"
                title="Copy conversation (Ctrl+Shift+C)" aria-keyshortcuts="Control+Shift+C">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect vector-effect="non-scaling-stroke" x="7.5" y="7.5" width="8.5" height="8.5" rx="2"></rect>
            <path vector-effect="non-scaling-stroke" d="M12.5 7.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v4.5a2 2 0 0 0 2 2h1.5"></path>
          </svg>
        </button>
        <button id="history-btn" class="g-icon small tool-quiet" type="button" aria-label="Open past conversations"
                title="History (Ctrl+H)" aria-keyshortcuts="Control+H">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path vector-effect="non-scaling-stroke" d="M3.75 10a6.25 6.25 0 1 0 6.25-6.25 6.77 6.77 0 0 0-4.68 1.91L3.75 7.25"></path>
            <path vector-effect="non-scaling-stroke" d="M3.75 3.75v3.5h3.5"></path>
            <path vector-effect="non-scaling-stroke" d="M10 6.5V10l2.75 1.4"></path>
          </svg>
        </button>
        <button id="new-chat" class="g-icon small tool-quiet" type="button" aria-label="Start over in this window"
                title="Start over">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path vector-effect="non-scaling-stroke" d="M10 4.5v11M4.5 10h11"></path>
          </svg>
        </button>
        <button id="close-out" class="g-icon small" type="button" aria-label="Close this window"
                title="Close (Ctrl+W)" aria-keyshortcuts="Control+W">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path vector-effect="non-scaling-stroke" d="M5.5 5.5l9 9M14.5 5.5l-9 9"></path>
          </svg>
        </button>
      </div>
    </header>
    <!-- Not live itself: streaming rewrote it every frame, which a screen
         reader heard as noise. Finished answers and step changes are said
         once, through AevalA11y.say. -->
    <div id="chat" class="edge-fade" role="log" aria-live="off"></div>
    <!-- Find's results: what matched, and for related matches, why. -->
    <div id="find-view" class="edge-fade" role="listbox" aria-label="Matches on screen" hidden></div>
  </section>

  <div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="announce-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script src="glass.js"></script>
  <script src="frame.js"></script>
  <script src="markdown.js"></script>
  <script src="glob.js"></script>
  <script src="output.js"></script>
  <script src="trail.js"></script>
</body>
</html>
