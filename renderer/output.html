<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>AevalBuddy answer</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body data-mode="idle">
  <section id="opanel" hidden aria-label="AevalBuddy conversation">
    <div id="chat-tools">
      <button id="new-chat" type="button" aria-label="Start a new conversation" title="New conversation">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button>
    </div>
    <div id="chat" role="log" aria-live="polite"></div>
  </section>

  <section id="hud" hidden aria-label="Answer position editor">
    <div class="hud-inner">
      <p class="hud-title">Answer window</p>
      <p class="hud-sub">Drag anywhere. Drop it near the input bar to dock them together.</p>
      <span id="dock-badge" class="dock-badge" hidden>Docked to input</span>
      <div class="hud-actions">
        <button id="dock-toggle" type="button">Detach</button>
        <button id="hud-done" type="button" class="accent-btn">Done</button>
      </div>
    </div>
  </section>

  <script src="markdown.js"></script>
  <script src="output.js"></script>
</body>
</html>
