appId: com.aevalbuddy.app
productName: AevalBuddy
directories:
  output: dist
files:
  - main.js
  - preload.js
  - lib/**
  - renderer/**
  - settings/**
  - history/**
  - skills/**
  - package.json
win:
  target: nsis
  # Generated by tools/make-icon.js from the pointer arrow; see npm prebuild.
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
