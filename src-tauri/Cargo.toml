[package]
name = "aevalbuddy"
version = "1.1.1"
description = "Screen-aware AI overlay for Windows"
authors = ["darkelights"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "aevalbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
