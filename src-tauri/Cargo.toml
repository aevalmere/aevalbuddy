[package]
name = "aevalbuddy"
version = "1.1.1"
description = "Screen-aware AI overlay for Windows"
authors = ["darkelights"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "aevalbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Core (agent a): store, history, hotkeys, tray, updater, windows, instance.
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process", "rt", "rt-multi-thread", "macros"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
regex = "1"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
raw-window-handle = "0.6"
winreg = "0.55"
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# --- split (c): desktop helper client, capture, glass backdrop ---
fast_image_resize = "5"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
unicode-normalization = "0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# --- end split (c) ---

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
