<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>backdrop fixture</title>
<!-- What the glass is photographed over in the visual self-check: a white
     document, a black code editor, and a saturated wallpaper. Rendered at the
     display's size in an offscreen window and handed to lib/backdrop.js as if
     it were the desktop. Never shown to anyone. Two more for the renderer
     shots (tools/ui-shots): dark-editor, a whole VS Code-like window, and
     photo-busy, a drawn photograph full of fine edges, grids and small text,
     the hardest thing to keep glass readable over. Both are drawn the same
     way every time. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body[data-kind="white"] { background: #fff; color: #111; font: 13px/1.5 "Segoe UI", sans-serif; }
  .doc { width: 760px; margin: 28px auto; }
  .doc h1 { font-size: 26px; margin: 8px 0 12px; }
  .doc h2 { font-size: 16px; margin: 18px 0 6px; }
  .doc p { margin: 0 0 9px; font-size: 11px; }
  .doc a { color: #0b57d0; }
  .doc table { border-collapse: collapse; margin: 10px 0; font-size: 11px; }
  .doc td, .doc th { border: 1px solid #ccc; padding: 4px 10px; }
  .doc .side { position: absolute; left: 0; top: 0; bottom: 0; width: 150px; background: #f3f4f6; border-right: 1px solid #ddd; }
  .bar { height: 30px; background: #f8f8f8; border-bottom: 1px solid #ddd; }

  body[data-kind="black"] { background: #1e1e1e; color: #d4d4d4; font: 13px/19px Consolas, "Cascadia Mono", monospace; }
  .ed { padding: 14px 0 0 0; white-space: pre; }
  .ed .ln { color: #6e7681; display: inline-block; width: 52px; text-align: right; padding-right: 16px; }
  .k { color: #569cd6; } .s { color: #ce9178; } .c { color: #6a9955; } .f { color: #dcdcaa; } .n { color: #b5cea8; }
  .tabs { height: 34px; background: #252526; border-bottom: 1px solid #333; }

  body[data-kind="wallpaper"] {
    background:
      radial-gradient(40% 55% at 18% 22%, #ff5f6d 0%, transparent 70%),
      radial-gradient(45% 60% at 82% 18%, #ffc371 0%, transparent 70%),
      radial-gradient(50% 60% at 70% 78%, #3a7bd5 0%, transparent 70%),
      radial-gradient(45% 55% at 22% 82%, #00d2ff 0%, transparent 70%),
      radial-gradient(30% 35% at 50% 50%, #f8f8ff 0%, transparent 70%),
      linear-gradient(135deg, #7b2ff7, #f107a3);
  }

  body[data-kind="dark-editor"] { background: #1e1e1e; color: #cccccc; font: 13px/19px Consolas, "Cascadia Mono", monospace; }
  .vs { display: grid; grid-template-columns: 48px 250px 1fr 90px; grid-template-rows: 30px 35px 1fr 200px 22px; height: 100vh; }
  .vs .title { grid-column: 1 / -1; background: #3c3c3c; color: #cccccc; font: 12px/30px "Segoe UI", sans-serif; text-align: center; }
  .vs .act { grid-row: 2 / 5; background: #333333; }
  .vs .act i { display: block; width: 24px; height: 24px; margin: 12px; border: 2px solid #858585; border-radius: 4px; }
  .vs .act i:first-child { border-color: #ffffff; }
  .vs .tree { grid-row: 2 / 5; background: #252526; font: 13px/22px "Segoe UI", sans-serif; padding-top: 6px; white-space: pre; overflow: hidden; }
  .vs .tree .sel { background: #37373d; display: block; }
  .vs .tabs2 { grid-column: 3 / 5; background: #252526; display: flex; }
  .vs .tabs2 span { padding: 0 18px; font: 13px/35px "Segoe UI", sans-serif; color: #969696; background: #2d2d2d; border-right: 1px solid #252526; }
  .vs .tabs2 span:first-child { background: #1e1e1e; color: #ffffff; border-top: 1px solid #007acc; }
  .vs .code { white-space: pre; overflow: hidden; padding-top: 4px; }
  .vs .code .ln { color: #858585; display: inline-block; width: 52px; text-align: right; padding-right: 20px; }
  .vs .mini { background: #1e1e1e; border-left: 1px solid #333; overflow: hidden; }
  .vs .mini b { display: block; height: 2px; margin: 1px 8px 1px 0; }
  .vs .term { grid-column: 3 / 5; border-top: 1px solid #414141; white-space: pre; overflow: hidden; padding: 6px 14px; color: #cccccc; }
  .vs .status { grid-column: 1 / -1; background: #007acc; color: #ffffff; font: 12px/22px "Segoe UI", sans-serif; padding: 0 10px; white-space: pre; }
  .t { color: #4ec9b0; } .v { color: #9cdcfe; } .p { color: #c586c0; } .e { color: #f14c4c; } .ok { color: #23d18b; }

  body[data-kind="photo-busy"] { background: #000; }
  body[data-kind="photo-busy"] canvas { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const kind = new URLSearchParams(location.search).get('kind') || 'wallpaper';
  document.body.dataset.kind = kind;
  const root = document.getElementById('root');
  const words = 'The quarterly invoice totals were reconciled against the ledger and two late payments were flagged for follow up before Friday. Please review the attached terms on page two and confirm the revised due dates with the vendor. '.repeat(2);
  if (kind === 'white') {
    let html = '<div class="bar"></div><div class="doc"><h1>Invoice 2291 for March</h1>';
    for (let i = 0; i < 14; i += 1) {
      if (i % 4 === 0) html += `<h2>Section ${i / 4 + 1}: payment terms</h2>`;
      html += `<p>${words.slice(0, 260 + (i % 3) * 60)} <a>See the policy</a>.</p>`;
      if (i === 5) html += '<table><tr><th>Item</th><th>Qty</th><th>Total due</th></tr><tr><td>Design</td><td>12</td><td>$4,120.00</td></tr><tr><td>Support</td><td>3</td><td>$540.00</td></tr></table>';
    }
    root.innerHTML = html + '</div>';
  } else if (kind === 'black') {
    const lines = [
      '<span class="c">// Settle the invoice once the payment clears.</span>',
      '<span class="k">import</span> { ledger } <span class="k">from</span> <span class="s">"./ledger"</span>;',
      '',
      '<span class="k">export async function</span> <span class="f">settle</span>(invoice, opts = {}) {',
      '  <span class="k">const</span> total = invoice.items.<span class="f">reduce</span>((s, i) => s + i.qty * i.price, <span class="n">0</span>);',
      '  <span class="k">if</span> (total <= <span class="n">0</span>) <span class="k">throw new</span> <span class="f">Error</span>(<span class="s">"nothing to settle"</span>);',
      '  <span class="k">await</span> ledger.<span class="f">post</span>({ id: invoice.id, total, due: opts.due ?? <span class="s">"Friday"</span> });',
      '  <span class="k">return</span> { ok: <span class="k">true</span>, total };',
      '}',
      '',
      '<span class="c">/* TODO: retry on 429 and 5xx with a bounded backoff */</span>',
    ];
    let html = '<div class="tabs"></div><div class="ed">';
    for (let i = 0; i < 46; i += 1) html += `<span class="ln">${i + 1}</span>${lines[i % lines.length]}\n`;
    root.innerHTML = html + '</div>';
  } else if (kind === 'dark-editor') {
    const code = [
      '<span class="p">import</span> { <span class="v">invoke</span> } <span class="p">from</span> <span class="s">"@tauri-apps/api/core"</span>;',
      '<span class="p">import</span> <span class="k">type</span> { <span class="t">Invoice</span>, <span class="t">Ledger</span> } <span class="p">from</span> <span class="s">"./types"</span>;',
      '',
      '<span class="c">/** Settles every open invoice, oldest first, and reports the total. */</span>',
      '<span class="k">export async function</span> <span class="f">settleAll</span>(<span class="v">ledger</span>: <span class="t">Ledger</span>, <span class="v">limit</span> = <span class="n">25</span>): <span class="t">Promise</span>&lt;<span class="t">number</span>&gt; {',
      '  <span class="k">const</span> <span class="v">open</span> = <span class="k">await</span> <span class="v">ledger</span>.<span class="f">list</span>({ <span class="v">state</span>: <span class="s">"open"</span>, <span class="v">sort</span>: <span class="s">"due"</span> });',
      '  <span class="k">let</span> <span class="v">total</span> = <span class="n">0</span>;',
      '  <span class="p">for</span> (<span class="k">const</span> <span class="v">inv</span> <span class="k">of</span> <span class="v">open</span>.<span class="f">slice</span>(<span class="n">0</span>, <span class="v">limit</span>)) {',
      '    <span class="p">if</span> (<span class="v">inv</span>.<span class="v">total</span> &lt;= <span class="n">0</span>) <span class="p">continue</span>; <span class="c">// credit notes settle themselves</span>',
      '    <span class="v">total</span> += <span class="k">await</span> <span class="f">invoke</span>&lt;<span class="t">number</span>&gt;(<span class="s">"settle"</span>, { <span class="v">id</span>: <span class="v">inv</span>.<span class="v">id</span>, <span class="v">due</span>: <span class="v">inv</span>.<span class="v">due</span> ?? <span class="s">"Friday"</span> });',
      '  }',
      '  <span class="p">return</span> <span class="v">total</span>;',
      '}',
      '',
      '<span class="k">export const</span> <span class="v">retry</span> = { <span class="v">codes</span>: [<span class="n">429</span>, <span class="n">500</span>, <span class="n">502</span>, <span class="n">503</span>], <span class="v">backoffMs</span>: <span class="n">750</span>, <span class="v">max</span>: <span class="n">4</span> } <span class="k">as const</span>;',
    ];
    const tree = ['  ▾ AEVAL-LEDGER', '    ▸ .github', '    ▸ node_modules', '    ▾ src', '      api.ts', '<span class="sel">      settle.ts</span>', '      types.ts', '      ui.tsx', '    ▸ tests', '    .gitignore', '    package.json', '    README.md', '    tsconfig.json'];
    let lines = '';
    for (let i = 0; i < 40; i += 1) lines += `<span class="ln">${i + 1}</span>${code[i % code.length]}\n`;
    let mini = '';
    const hues = ['#569cd6', '#ce9178', '#6a9955', '#dcdcaa', '#9cdcfe', '#c586c0', '#4ec9b0'];
    for (let i = 0; i < 160; i += 1) mini += `<b style="width:${20 + ((i * 37) % 60)}px;background:${hues[i % hues.length]};opacity:.55"></b>`;
    const term = [
      'PS C:\\src\\aeval-ledger&gt; npm test',
      '',
      '&gt; aeval-ledger@1.4.0 test',
      '&gt; vitest run',
      '',
      ' <span class="ok">✓</span> tests/settle.test.ts (12 tests) 41ms',
      ' <span class="ok">✓</span> tests/api.test.ts (8 tests) 19ms',
      ' <span class="e">✗</span> tests/ui.test.tsx &gt; renders the total due <span class="e">AssertionError: expected "$4,660.00" to be "$4,120.00"</span>',
      '',
      ' Test Files  <span class="e">1 failed</span> | <span class="ok">2 passed</span> (3)',
    ].join('\n');
    root.innerHTML = `<div class="vs"><div class="title">settle.ts — aeval-ledger — Visual Studio Code</div>
      <div class="act"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="tree">${tree.join('\n')}</div>
      <div class="tabs2"><span>settle.ts</span><span>types.ts</span><span>ui.tsx</span><span>package.json</span></div>
      <div class="code">${lines}</div><div class="mini">${mini}</div>
      <div class="term">${term}</div>
      <div class="status">  main*   ⟳   ⊗ 1  ⚠ 3        Ln 9, Col 42   Spaces: 2   UTF-8   LF   TypeScript</div></div>`;
  } else if (kind === 'photo-busy') {
    // A seeded generator, so every run draws the same picture.
    let seed = 0x2291;
    const rnd = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const w = innerWidth;
    const h = innerHeight;
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    root.appendChild(cv);
    const g = cv.getContext('2d');
    // Sky and ground.
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#5b8fd6');
    sky.addColorStop(0.45, '#f2c9a0');
    sky.addColorStop(0.55, '#46525e');
    sky.addColorStop(1, '#1b1f24');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
    // A skyline: blocks with lit window grids, the finest edges there are.
    for (let x = -20; x < w; ) {
      const bw = 40 + rnd() * 120;
      const bh = h * (0.25 + rnd() * 0.45);
      const top = h * 0.62 - bh;
      const shade = 30 + Math.floor(rnd() * 60);
      g.fillStyle = `rgb(${shade},${shade + 6},${shade + 14})`;
      g.fillRect(x, top, bw, h - top);
      for (let wy = top + 8; wy < h - 10; wy += 9) {
        for (let wx = x + 5; wx < x + bw - 6; wx += 7) {
          if (rnd() < 0.55) {
            g.fillStyle = rnd() < 0.8 ? '#ffd27a' : '#e8f4ff';
            g.fillRect(wx, wy, 3, 4);
          }
        }
      }
      x += bw + 2 + rnd() * 10;
    }
    // Stripes, a checkerboard and a grid of hairlines.
    for (let i = 0; i < w; i += 4) {
      g.fillStyle = i % 8 ? '#ffffff' : '#000000';
      g.fillRect(i, h * 0.08, 2, 60);
    }
    for (let cy = 0; cy < 12; cy += 1) {
      for (let cx = 0; cx < 24; cx += 1) {
        g.fillStyle = (cx + cy) % 2 ? '#111111' : '#f5f5f5';
        g.fillRect(w * 0.62 + cx * 12, h * 0.2 + cy * 12, 12, 12);
      }
    }
    g.strokeStyle = 'rgba(255,255,255,0.35)';
    g.lineWidth = 1;
    for (let gx = 0.5; gx < w; gx += 32) {
      g.beginPath();
      g.moveTo(gx, h * 0.66);
      g.lineTo(gx, h);
      g.stroke();
    }
    for (let gy = h * 0.66 + 0.5; gy < h; gy += 32) {
      g.beginPath();
      g.moveTo(0, gy);
      g.lineTo(w, gy);
      g.stroke();
    }
    // Speckle, as sensor noise.
    for (let i = 0; i < (w * h) / 40; i += 1) {
      const v = Math.floor(rnd() * 255);
      g.fillStyle = `rgba(${v},${v},${v},0.35)`;
      g.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * h), 1, 1);
    }
    // Text everywhere: signs, captions, small print, light and dark.
    const say = ['OPEN 24H', 'Invoice 2291', 'total due 42.00', 'EXIT', 'Platform 4', 'SALE -40%', 'No parking', 'Café', 'Friday 09:30'];
    for (let i = 0; i < 90; i += 1) {
      const size = [9, 11, 14, 22, 36][Math.floor(rnd() * 5)];
      g.font = `${rnd() < 0.5 ? 'bold ' : ''}${size}px "Segoe UI", sans-serif`;
      g.fillStyle = rnd() < 0.5 ? '#ffffff' : '#101010';
      g.fillText(say[Math.floor(rnd() * say.length)], rnd() * w, rnd() * h);
    }
  }
</script>
</body>
</html>
