<!DOCTYPE html>
<html lang="en" data-resize="all" data-resize-target="#app">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>AevalBuddy history</title>
  <link rel="stylesheet" href="../renderer/glass.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div id="app" class="glass thick refract">
    <header id="titlebar" class="sheet-bar" data-drag="max">
      <span class="sheet-bar-title">History</span>
      <div class="sheet-bar-tools">
        <button id="close-history" class="g-icon small" type="button" aria-label="Close history"><span class="ico i-x" aria-hidden="true"></span></button>
      </div>
    </header>

    <div id="searchbar">
      <div class="search-field">
        <span class="ico i-search" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search your conversations"
               aria-label="Search your conversations" aria-controls="list" autocomplete="off" spellcheck="false" />
        <button id="clear-search" class="g-icon small" type="button" aria-label="Clear the search" hidden><span class="ico i-x" aria-hidden="true"></span></button>
      </div>
    </div>

    <!-- History is off, but older conversations are still here. -->
    <p id="off-note" class="off-note" hidden>History is off, so nothing new is being saved.
      <button id="off-turn-on" type="button" class="text-btn">Turn on</button></p>

    <!-- The list is the window: one group per day, each row the question,
         the opening of the answer and when. A row is two buttons side by
         side, open and delete; never one inside the other. -->
    <main id="list" class="edge-fade" aria-label="Conversations"></main>

    <div id="empty" class="empty" hidden>
      <p id="empty-text"></p>
      <button id="empty-turn-on" type="button" class="text-btn" hidden>Turn on</button>
    </div>

    <footer id="foot">
      <span id="count"></span>
      <p id="note" class="note" role="status"></p>
      <button id="undo" type="button" class="text-btn" hidden>Undo</button>
      <button id="clear-all" type="button" class="quiet-danger">Delete all</button>
      <span id="confirm" class="confirm" hidden>
        <span id="confirm-text"></span>
        <button id="confirm-yes" type="button" class="g-btn danger">Delete</button>
        <button id="confirm-no" type="button" class="g-btn">Keep</button>
      </span>
    </footer>

    <div id="row-menu" class="row-menu g-menu" role="menu" aria-label="Conversation" hidden>
      <button type="button" role="menuitem" tabindex="-1" data-cmd="ask">Ask again</button>
      <button type="button" role="menuitem" tabindex="-1" data-cmd="copy">Copy question</button>
      <button type="button" role="menuitem" tabindex="-1" data-cmd="delete">Delete</button>
    </div>
  </div>

  <script src="../renderer/glass.js"></script>
  <script src="../renderer/frame.js"></script>
  <script src="history.js"></script>
</body>
</html>
