<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <title>AevalBuddy history</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span class="title">History</span>
      <button id="close-history" type="button" aria-label="Close history">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div id="searchbar">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
      </svg>
      <input id="search" type="search" placeholder="Search your conversations"
             aria-label="Search your conversations" autocomplete="off" spellcheck="false" />
      <button id="clear-search" type="button" aria-label="Clear the search" hidden>Clear</button>
    </div>

    <!-- The list is the window. Rows carry the question, the opening of the
         answer, and when it was; that is what someone scans for when they
         remember an answer but not how they asked for it. -->
    <main id="list" tabindex="-1"></main>

    <p id="empty" hidden></p>

    <footer id="foot">
      <span id="count"></span>
      <span class="spacer"></span>
      <button id="clear-all" type="button" class="link danger">Clear all</button>
      <span id="confirm" hidden>
        <span>Delete everything?</span>
        <button id="confirm-yes" type="button" class="link danger">Delete</button>
        <button id="confirm-no" type="button" class="link">Keep</button>
      </span>
    </footer>
  </div>

  <script src="history.js"></script>
</body>
</html>
